name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate Shell Script Syntax
        run: |
          bash -n stats.sh
          bash -n speedtest.sh

      - name: Validate Manifest JSON
        run: |
          node -e '
            const manifest = JSON.parse(require("fs").readFileSync("manifest.json", "utf8"));
            if (!manifest.id || !manifest.version || !manifest.entryPoints) {
              console.error("Invalid manifest structure");
              process.exit(1);
            }
            console.log("Manifest valid: " + manifest.id + " v" + manifest.version);
          '

      - name: Verify 100% PlainText QML Text Sinks
        run: |
          node -e '
            const fs = require("fs");
            const content = fs.readFileSync("BarWidget.qml", "utf8");
            const textBlocks = content.split(/\bText\s*\{/g).slice(1);
            let missing = 0;
            textBlocks.forEach((block, idx) => {
              const body = block.split("}")[0];
              if (!body.includes("textFormat: Text.PlainText")) {
                console.error(`Missing PlainText in Text block #${idx + 1}`);
                missing++;
              }
            });
            if (missing > 0) {
              console.error(`Found ${missing} Text blocks without explicit PlainText`);
              process.exit(1);
            }
            console.log(`Verified ${textBlocks.length} Text components have explicit PlainText format.`);
          '

      - name: Run Security & Regression Test Suite
        run: node test.js
